name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s assets/branding/tokens.json
          python3 -m json.tool assets/branding/tokens.json >/dev/null

          # A committed .env.example is an intentional public-safe template.
          # Real environment files, databases, keys, and model weights are blocked.
          while IFS= read -r file; do
            filename="${file##*/}"
            case "$filename" in
              .env.example)
                continue
                ;;
              .env|.env.*|*.db|*.sqlite|*.sqlite3|*.jks|*.pem|*.safetensors)
                echo "Potential sensitive file checked in: $file"
                exit 1
                ;;
            esac
          done < <(git ls-files)

          echo "Hygiene validation complete (not a production security audit)."
